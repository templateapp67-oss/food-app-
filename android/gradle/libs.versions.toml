[versions]
agp = "8.13.2"
kotlin = "2.2.20"
composeUi = "1.8.2"
material3 = "1.3.2"
activity = "1.10.1"
lifecycle = "2.9.0"
coroutines = "1.10.2"
junit = "4.13.2"
[libraries]
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeUi" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "composeUi" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeUi" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-vm = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
