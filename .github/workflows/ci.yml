name: Nexora Food checks
on: [push, pull_request, workflow_dispatch]
jobs:
 web:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '24', cache: npm}
   - run: npm ci
   - run: npm test
   - run: npm run build
 android-debug:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
   - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
   - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
     working-directory: android
   - uses: actions/upload-artifact@v4
     with: {name: nexora-food-debug-apk, path: android/app/build/outputs/apk/debug/*.apk}
 database:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: supabase/setup-cli@v1
     with: {version: 2.83.0}
   - run: supabase start
   - run: supabase db reset
   - run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/shared-food-integration.sql
   - run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/operations-integration.sql
   - run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/multi-role-integration.sql
   - run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/restaurant-approvals-integration.sql

 browser:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - run: npm ci && npm run build
   - run: npm ci && npx playwright install --with-deps chromium webkit && npm test
     working-directory: qa/browser
   - uses: actions/upload-artifact@v4
     if: always()
     with: {name: nexora-browser-reports, path: 'qa/browser/playwright-report/'}
   - uses: actions/upload-artifact@v4
     if: always()
     with: {name: nexora-browser-traces, path: 'qa/browser/test-results/'}
   - name: Test the published Sites deployment
     run: npm test
     working-directory: qa/browser
     env:
      PLAYWRIGHT_BASE_URL: https://nexora-food.templateapp67.chatgpt.site
   - uses: actions/upload-artifact@v4
     if: always()
     with: {name: nexora-live-browser-reports, path: 'qa/browser/playwright-report/'}
 android-device:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
     with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
   - name: Enable emulator acceleration
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 35
      target: google_apis
      arch: x86_64
      working-directory: android
      script: |
       chmod +x gradlew
       adb emu geo fix 75.7873 26.9124
       ./gradlew connectedDebugAndroidTest assembleDebug
       mkdir -p device-evidence
       adb shell screencap -p /sdcard/nexora-screen.png
       adb pull /sdcard/nexora-screen.png device-evidence/
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: nexora-android-device-results
      path: |
       android/app/build/reports/androidTests/
       android/app/build/outputs/androidTest-results/
       android/app/build/outputs/apk/debug/
       android/device-evidence/
